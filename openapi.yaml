                        transaction_id: "TRX-GEN-20261026-0087"
                        source: "generator"
                        cashier_id: null
                        items:
                          - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                            product_name: "Kopi Susu Gula Aren"
                            category: "Kopi"
                            qty: 1
                            price_at_sale: 22000
                            cost_at_sale: 12000
                        total: 22000
                        payment_method: "transfer"
                        transaction_time: "2026-10-26T15:20:00.000Z"
                        createdAt: "2026-10-26T15:20:00.000Z"
                    pagination:
                      page: 1
                      limit: 10
                      total_items: 342
                      total_pages: 35
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/analytics/summary:
    get:
      tags:
        - Analytics
      operationId: getAnalyticsSummary
      summary: Ringkasan penjualan
      description: |
        Mengambil ringkasan total omzet dan jumlah transaksi pada rentang tanggal.
        Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
      responses:
        '200':
          description: Ringkasan penjualan berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
              examples:
                success:
                  summary: Ringkasan penjualan
                  value:
                    start_date: "2026-10-01"
                    end_date: "2026-10-27"
                    total_omzet: 18750000
                    total_transactions: 342
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/analytics/best-selling:
    get:
      tags:
        - Analytics
      operationId: getBestSellingProducts
      summary: Produk terlaris
      description: |
        Mengambil daftar produk terlaris berdasarkan jumlah terjual dan pendapatan
        pada rentang tanggal. Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - $ref: '#/components/parameters/TopLimitParam'
      responses:
        '200':
          description: Daftar produk terlaris berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestSellingResponse'
              examples:
                success:
                  summary: Lima produk terlaris
                  value:
                    start_date: "2026-10-01"
                    end_date: "2026-10-27"
                    limit: 5
                    data:
                      - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                        product_code: "KPI-001"
                        product_name: "Kopi Susu Gula Aren"
                        category: "Kopi"
                        total_qty: 420
                        total_revenue: 9240000
                      - product_id: "665f1a2b3c4d5e6f7a8b9c11"
                        product_code: "KPI-002"
                        product_name: "Es Teh Manis"
                        category: "Minuman"
                        total_qty: 310
                        total_revenue: 2480000
                      - product_id: "665f1a2b3c4d5e6f7a8b9c12"
                        product_code: "KPI-003"
                        product_name: "Croissant Butter"
                        category: "Snack"
                        total_qty: 90
                        total_revenue: 1620000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/analytics/low-margin:
    get:
      tags:
        - Analytics
      operationId: getLowMarginProducts
      summary: Produk dengan margin rendah
      description: |
        Mengambil daftar produk dengan margin rendah atau negatif. Perhitungan hanya
        menggunakan item yang memiliki nilai `cost_at_sale` terisi. Hanya dapat
        diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - $ref: '#/components/parameters/ThresholdParam'
      responses:
        '200':
          description: Daftar produk bermargin rendah berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LowMarginResponse'
              examples:
