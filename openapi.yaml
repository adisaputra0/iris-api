openapi: 3.0.0

info:
  title: Sales Analytics & POS API Specification
  version: 1.0.0
  description: |
    Spesifikasi RESTful API untuk aplikasi Sales Analytics dan Point of Sale (POS)
    berbasis MongoDB. Seluruh pengguna, baik owner maupun kasir, tersimpan dalam
    satu koleksi `users` dan memiliki field `role`. API menyediakan autentikasi
    terpadu, pengelolaan produk, transaksi POS, riwayat pesanan, analitik penjualan,
    serta AI Agent untuk membantu owner menganalisis data penjualan.

    Autentikasi menggunakan JSON Web Token (JWT). Kirimkan token pada header
    `Authorization` dengan format `Bearer <token>`.

    Endpoint login tidak memerlukan token. Seluruh endpoint lain memerlukan token
    yang valid. Otorisasi menggunakan Role-Based Access Control (RBAC):
    endpoint POS dan katalog produk dapat diakses oleh role `owner` dan `cashier`,
    sedangkan manajemen produk (create, update, delete), analitik, riwayat pesanan
    owner, dan AI Agent hanya dapat diakses oleh role `owner`. Akses cashier ke
    endpoint khusus owner akan menghasilkan `403 Forbidden`.

tags:
  - name: Auth
    description: Autentikasi terpadu owner dan kasir melalui satu endpoint.
  - name: Products
    description: Katalog produk untuk owner dan kasir, serta manajemen produk khusus owner.
  - name: POS Orders
    description: Transaksi dan riwayat pesanan POS untuk owner dan kasir.
  - name: Owner Orders
    description: Riwayat seluruh pesanan untuk owner.
  - name: Analytics
    description: Analitik penjualan dan laporan bisnis.
  - name: AI Agent
    description: Asisten AI untuk analisis penjualan berbasis percakapan.

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: http://127.0.0.1:5000
    description: Local development server alternatif

security:
  - BearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login terpadu owner dan kasir
      description: |
        Melakukan autentikasi untuk seluruh pengguna melalui satu endpoint.
        Owner dan kasir menggunakan koleksi `users` yang sama dan login dengan
        `email` serta `password`. Role pengguna (`owner` atau `cashier`) disimpan
        pada field `role` dan disertakan di dalam JWT serta objek user pada response.

        Endpoint ini tidak memerlukan Bearer Token. Token yang dihasilkan harus
        dikirim sebagai `Authorization: Bearer <token>` pada endpoint berikutnya.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              owner:
                summary: Contoh login owner
                value:
                  email: "owner@tokokopi.id"
                  password: "rahasia123"
              cashier:
                summary: Contoh login kasir
                value:
                  email: "siti@tokokopi.id"
                  password: "kasir123"
      responses:
        '200':
          description: Login berhasil untuk role owner maupun cashier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                owner:
                  summary: Login owner berhasil
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NjVmMWEyYjNjNGQ1ZTZmN2E4YjljMGQiLCJyb2xlIjoib3duZXIiLCJpYXQiOjE3NjE1NTQ5MzAsImV4cCI6MTc2MTY0MTMzMH0.dGVzdC1zaWduYXR1cmUtZHVtbXk"
                    token_type: "Bearer"
                    expires_in: 86400
                    user:
                      _id: "665f1a2b3c4d5e6f7a8b9c0d"
                      name: "Budi Santoso"
                      email: "owner@tokokopi.id"
                      role: "owner"
                      createdAt: "2026-01-15T08:30:00.000Z"
                      updatedAt: "2026-10-20T09:12:45.000Z"
                cashier:
                  summary: Login cashier berhasil
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NjVmMWEyYjNjNGQ1ZTZmN2E4YjljMWUiLCJyb2xlIjoiY2FzaGllciIsImlhdCI6MTc2MTU1NDkzMCwiZXhwIjoxNzYxNjQxMzMwfQ.Y2FzaGllci10ZXN0LXNpZ25hdHVyZQ"
                    token_type: "Bearer"
                    expires_in: 28800
                    user:
                      _id: "665f1a2b3c4d5e6f7a8b9c1e"
                      name: "Siti Aminah"
                      email: "siti@tokokopi.id"
                      role: "cashier"
                      createdAt: "2026-02-01T07:00:00.000Z"
                      updatedAt: "2026-10-25T06:45:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: Ambil daftar produk
      description: |
        Mengambil daftar produk dengan dukungan pagination, pencarian berdasarkan nama
        atau kode produk, dan filter kategori. Katalog dapat diakses oleh role
        `owner` dan `cashier`. Endpoint create, update, dan delete produk hanya
        dapat diakses oleh role `owner`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/CategoryParam'
      responses:
        '200':
          description: Daftar produk berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                success:
                  summary: Daftar produk dengan pagination
                  value:
                    data:
                      - _id: "665f1a2b3c4d5e6f7a8b9c10"
                        product_code: "KPI-001"
                        name: "Kopi Susu Gula Aren"
                        category: "Kopi"
                        selling_price: 22000
                        cost_price: 12000
                        is_active: true
                        createdAt: "2026-03-01T08:00:00.000Z"
                        updatedAt: "2026-10-01T10:30:00.000Z"
                      - _id: "665f1a2b3c4d5e6f7a8b9c11"
                        product_code: "KPI-002"
                        name: "Es Teh Manis"
                        category: "Minuman"
                        selling_price: 8000
                        cost_price: 2500
                        is_active: true
                        createdAt: "2026-03-01T08:05:00.000Z"
                        updatedAt: "2026-09-15T11:20:00.000Z"
                      - _id: "665f1a2b3c4d5e6f7a8b9c12"
                        product_code: "KPI-003"
                        name: "Croissant Butter"
                        category: "Snack"
                        selling_price: 18000
                        cost_price: 9000
                        is_active: true
                        createdAt: "2026-03-02T09:10:00.000Z"
                        updatedAt: "2026-08-21T14:00:00.000Z"
                      - _id: "665f1a2b3c4d5e6f7a8b9c13"
                        product_code: "KPI-004"
                        name: "Brownies Fudge"
                        category: "Dessert"
                        selling_price: 25000
                        cost_price: null
                        is_active: false
                        createdAt: "2026-03-05T10:00:00.000Z"
                        updatedAt: "2026-10-10T16:45:00.000Z"
                    pagination:
                      page: 1
                      limit: 10
                      total_items: 24
                      total_pages: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Products
      operationId: createProduct
      summary: Tambah produk baru
      description: |
        Menambahkan produk baru. Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
        Nilai `product_code` dibuat otomatis oleh server dengan format `KPI-XXX`.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            examples:
              newProduct:
                summary: Contoh produk baru
                value:
                  name: "Matcha Latte"
                  category: "Minuman"
                  selling_price: 24000
                  cost_price: 13500
      responses:
        '201':
          description: Produk berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                created:
                  summary: Produk berhasil dibuat
                  value:
                    message: "Produk berhasil dibuat"
                    data:
                      _id: "665f1a2b3c4d5e6f7a8b9c14"
                      product_code: "KPI-005"
                      name: "Matcha Latte"
                      category: "Minuman"
                      selling_price: 24000
                      cost_price: 13500
                      is_active: true
                      createdAt: "2026-10-27T03:15:00.000Z"
                      updatedAt: "2026-10-27T03:15:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{id}:
    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Perbarui produk
      description: |
        Memperbarui data produk berdasarkan ID. Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
        Seluruh field bersifat opsional, tetapi minimal satu field harus dikirim.
      parameters:
        - $ref: '#/components/parameters/ProductIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            examples:
              updatePrice:
                summary: Contoh memperbarui harga
                value:
                  selling_price: 25000
                  cost_price: 13500
              deactivate:
                summary: Contoh menonaktifkan produk
                value:
                  is_active: false
      responses:
        '200':
          description: Produk berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                updated:
                  summary: Produk berhasil diperbarui
                  value:
                    message: "Produk berhasil diperbarui"
                    data:
                      _id: "665f1a2b3c4d5e6f7a8b9c14"
                      product_code: "KPI-005"
                      name: "Matcha Latte"
                      category: "Minuman"
                      selling_price: 25000
                      cost_price: 13500
                      is_active: true
                      createdAt: "2026-10-27T03:15:00.000Z"
                      updatedAt: "2026-10-27T04:20:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Products
      operationId: deleteProduct
      summary: Nonaktifkan produk
      description: |
        Melakukan soft delete dengan mengubah `is_active` menjadi `false`.
        Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/ProductIdPathParam'
      responses:
        '200':
          description: Produk berhasil dinonaktifkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                deactivated:
                  summary: Produk berhasil dinonaktifkan
                  value:
                    message: "Produk berhasil dinonaktifkan"
                    data:
                      _id: "665f1a2b3c4d5e6f7a8b9c14"
                      product_code: "KPI-005"
                      name: "Matcha Latte"
                      category: "Minuman"
                      selling_price: 25000
                      cost_price: 13500
                      is_active: false
                      createdAt: "2026-10-27T03:15:00.000Z"
                      updatedAt: "2026-10-27T05:05:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pos/orders:
    post:
      tags:
        - POS Orders
      operationId: createPosOrder
      summary: Buat transaksi POS
      description: |
        Membuat transaksi baru dari POS. Dapat diakses oleh role `cashier` dan `owner`.
        Harga, biaya, dan nama produk diambil langsung dari database pada sisi server,
        sehingga harga tidak dapat dimanipulasi dari request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              qrisOrder:
                summary: Contoh transaksi dengan QRIS
                value:
                  items:
                    - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                      qty: 2
                    - product_id: "665f1a2b3c4d5e6f7a8b9c12"
                      qty: 1
                  payment_method: "qris"
              cashOrder:
                summary: Contoh transaksi tunai
                value:
                  items:
                    - product_id: "665f1a2b3c4d5e6f7a8b9c11"
                      qty: 3
                  payment_method: "tunai"
      responses:
        '201':
          description: Transaksi POS berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                created:
                  summary: Transaksi berhasil dibuat
                  value:
                    message: "Transaksi berhasil dibuat"
                    data:
                      _id: "66f0a1b2c3d4e5f6a7b8c9d0"
                      transaction_id: "TRX-20261027-0001"
                      source: "pos"
                      cashier_id: "665f1a2b3c4d5e6f7a8b9c1e"
                      items:
                        - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                          product_name: "Kopi Susu Gula Aren"
                          category: "Kopi"
                          qty: 2
                          price_at_sale: 22000
                          cost_at_sale: 12000
                        - product_id: "665f1a2b3c4d5e6f7a8b9c12"
                          product_name: "Croissant Butter"
                          category: "Snack"
                          qty: 1
                          price_at_sale: 18000
                          cost_at_sale: 9000
                      total: 62000
                      payment_method: "qris"
                      transaction_time: "2026-10-27T10:15:30.000Z"
                      createdAt: "2026-10-27T10:15:30.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pos/orders/today:
    get:
      tags:
        - POS Orders
      operationId: listTodayPosOrders
      summary: Riwayat transaksi hari ini
      description: |
        Mengambil seluruh transaksi POS pada hari ini. Endpoint bersifat read-only
        dan dapat diakses oleh role `cashier` dan `owner`.
      responses:
        '200':
          description: Riwayat transaksi hari ini berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayOrdersResponse'
              examples:
                success:
                  summary: Transaksi hari ini
                  value:
                    date: "2026-10-27"
                    total_transactions: 12
                    total_omzet: 1875000
                    data:
                      - _id: "66f0a1b2c3d4e5f6a7b8c9d0"
                        transaction_id: "TRX-20261027-0001"
                        source: "pos"
                        cashier_id: "665f1a2b3c4d5e6f7a8b9c1e"
                        items:
                          - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                            product_name: "Kopi Susu Gula Aren"
                            category: "Kopi"
                            qty: 2
                            price_at_sale: 22000
                            cost_at_sale: 12000
                          - product_id: "665f1a2b3c4d5e6f7a8b9c12"
                            product_name: "Croissant Butter"
                            category: "Snack"
                            qty: 1
                            price_at_sale: 18000
                            cost_at_sale: 9000
                        total: 62000
                        payment_method: "qris"
                        transaction_time: "2026-10-27T10:15:30.000Z"
                        createdAt: "2026-10-27T10:15:30.000Z"
                      - _id: "66f0a1b2c3d4e5f6a7b8c9d1"
                        transaction_id: "TRX-20261027-0002"
                        source: "pos"
                        cashier_id: "665f1a2b3c4d5e6f7a8b9c1e"
                        items:
                          - product_id: "665f1a2b3c4d5e6f7a8b9c11"
                            product_name: "Es Teh Manis"
                            category: "Minuman"
                            qty: 3
                            price_at_sale: 8000
                            cost_at_sale: 2500
                        total: 24000
                        payment_method: "tunai"
                        transaction_time: "2026-10-27T10:42:11.000Z"
                        createdAt: "2026-10-27T10:42:11.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/orders:
    get:
      tags:
        - Owner Orders
      operationId: listOwnerOrders
      summary: Ambil seluruh riwayat pesanan
      description: |
        Mengambil riwayat seluruh pesanan dengan filter rentang tanggal dan pagination.
        Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      parameters:
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Riwayat pesanan berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                success:
                  summary: Riwayat pesanan dengan pagination
                  value:
                    data:
                      - _id: "66f0a1b2c3d4e5f6a7b8c9d0"
                        transaction_id: "TRX-20261027-0001"
                        source: "pos"
                        cashier_id: "665f1a2b3c4d5e6f7a8b9c1e"
                        items:
                          - product_id: "665f1a2b3c4d5e6f7a8b9c10"
                            product_name: "Kopi Susu Gula Aren"
