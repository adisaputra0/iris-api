  responses:
    BadRequest:
      description: Permintaan tidak dapat diproses karena data tidak valid atau produk tidak aktif.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              summary: Data transaksi tidak valid
              value:
                success: false
                message: "Produk tidak aktif atau kuantitas tidak valid"
                errors:
                  - field: "items[0].qty"
                    message: "qty harus lebih besar dari 0"

    Unauthorized:
      description: Token tidak ada, tidak valid, atau sudah kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Token tidak valid
              value:
                success: false
                message: "Unauthorized, token tidak valid atau sudah kedaluwarsa"

    Forbidden:
      description: Pengguna tidak memiliki peran yang sesuai untuk mengakses endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Peran tidak diizinkan
              value:
                success: false
                message: "Forbidden, endpoint ini hanya dapat diakses oleh owner"

    NotFound:
      description: Sumber daya yang diminta tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Produk tidak ditemukan
              value:
                success: false
                message: "Produk dengan id 665f1a2b3c4d5e6f7a8b9c14 tidak ditemukan"

    ValidationError:
      description: Validasi request body atau parameter gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validasi gagal
              value:
                success: false
                message: "Validasi gagal"
                errors:
                  - field: "selling_price"
                    message: "selling_price harus berupa angka positif"
                  - field: "category"
                    message: "category harus salah satu dari Kopi, Minuman, Makanan, Snack, Dessert"

    InternalServerError:
      description: Terjadi kesalahan internal pada server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              summary: Kesalahan internal
              value:
                success: false
                message: "Terjadi kesalahan internal pada server"
