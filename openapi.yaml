  /api/v1/agent/chat:
    post:
      tags:
        - AI Agent
      operationId: agentChat
      summary: Kirim pesan ke AI Agent
      description: |
        Mengirim pesan ke AI Agent dan menerima balasan. Jika `session_id` tidak
        dikirim, server akan membuat sesi baru. Agent dapat memanggil fungsi analitik
        secara otomatis untuk menjawab pertanyaan owner. Hanya dapat diakses oleh role `owner`. Role `cashier` akan menerima `403 Forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
            examples:
              withSession:
                summary: Melanjutkan sesi yang sudah ada
                value:
                  message: "Berapa total omzet minggu ini dan produk apa yang paling laris?"
                  session_id: "sess-9f8e7d6c5b4a"
              newSession:
                summary: Memulai sesi baru
                value:
                  message: "Bandingkan penjualan bulan ini dengan bulan lalu."
      responses:
        '200':
          description: Balasan AI Agent berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
              examples:
                withFunctionCall:
                  summary: Balasan dengan eksekusi function call
                  value:
                    reply: "Total omzet minggu ini Rp18.750.000 dari 342 transaksi. Produk terlaris adalah Kopi Susu Gula Aren dengan 420 terjual."
                    session_id: "sess-9f8e7d6c5b4a"
                    function_call_executed:
                      name: "get_best_selling_products"
                      arguments:
                        start_date: "2026-10-20"
                        end_date: "2026-10-27"
                        limit: 5
                      result:
                        total_omzet: 18750000
                        total_transactions: 342
                        top_product: "Kopi Susu Gula Aren"
                withoutFunctionCall:
                  summary: Balasan tanpa eksekusi function call
                  value:
                    reply: "Tentu, saya dapat membantu menganalisis penjualan Anda. Silakan sebutkan periode yang ingin dianalisis."
                    session_id: "sess-1a2b3c4d5e6f"
                    function_call_executed: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

