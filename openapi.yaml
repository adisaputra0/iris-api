        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Masukkan JWT yang diperoleh dari endpoint login terpadu. Format header
        `Authorization: Bearer <token>`. JWT membawa identitas user dan klaim
        `role` (`owner` atau `cashier`) yang digunakan untuk pemeriksaan RBAC.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Nomor halaman, dimulai dari 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Jumlah data per halaman.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    SearchParam:
      name: search
      in: query
      required: false
      description: Pencarian berdasarkan nama atau kode produk.
      schema:
        type: string
        example: "kopi"
    CategoryParam:
      name: category
      in: query
      required: false
      description: Filter kategori produk.
      schema:
        type: string
        enum:
          - "Kopi"
          - "Minuman"
          - "Makanan"
          - "Snack"
          - "Dessert"
        example: "Kopi"
    StartDateParam:
      name: start_date
      in: query
      required: false
      description: Tanggal awal periode dalam format YYYY-MM-DD.
      schema:
        type: string
        format: date
        example: "2026-10-01"
    EndDateParam:
      name: end_date
      in: query
      required: false
      description: Tanggal akhir periode dalam format YYYY-MM-DD.
      schema:
        type: string
        format: date
        example: "2026-10-27"
    ThresholdParam:
      name: threshold
      in: query
      required: false
      description: Ambang batas margin dalam bentuk desimal, contoh 0.15 berarti 15 persen.
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1
        default: 0.15
        example: 0.15
    TopLimitParam:
      name: limit
      in: query
      required: false
      description: Jumlah produk teratas yang dikembalikan.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 5
        example: 5
    IntervalParam:
      name: interval
      in: query
      required: false
      description: Interval agregasi data tren.
      schema:
        type: string
        enum:
          - "daily"
          - "weekly"
          - "monthly"
        default: "weekly"
        example: "weekly"
    ProductIdQueryParam:
      name: product_id
      in: query
      required: false
      description: Filter tren berdasarkan ID produk.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: "665f1a2b3c4d5e6f7a8b9c10"
    SessionIdParam:
      name: session_id
      in: query
      required: true
      description: ID sesi percakapan AI Agent.
      schema:
        type: string
        example: "sess-9f8e7d6c5b4a"
    ProductIdPathParam:
      name: id
      in: path
      required: true
      description: ID produk (ObjectId MongoDB).
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: "665f1a2b3c4d5e6f7a8b9c14"

  schemas:
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "selling_price"
        message:
          type: string
          example: "selling_price harus berupa angka positif"

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Terjadi kesalahan pada permintaan"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    Pagination:
      type: object
      required:
        - page
        - limit
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 24
        total_pages:
          type: integer
          example: 3

    User:
      type: object
      description: |
        Dokumen pengguna terpadu pada koleksi `users`. Koleksi ini menyimpan akun
        owner dan cashier, yang dibedakan melalui field `role`.
      required:
        - _id
        - name
        - email
        - role
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: "Budi Santoso"
        email:
          type: string
          format: email
          example: "owner@tokokopi.id"
        role:
          type: string
          enum:
            - "owner"
            - "cashier"
          description: Peran pengguna yang menentukan hak akses endpoint.
          example: "owner"
        password:
          type: string
          format: password
          writeOnly: true
          description: Password ter-hash yang disimpan di database dan tidak pernah dikembalikan pada response.
          example: "$2b$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T08:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-20T09:12:45.000Z"

    ProductCategory:
      type: string
      enum:
        - "Kopi"
        - "Minuman"
        - "Makanan"
        - "Snack"
        - "Dessert"
      example: "Kopi"

    Product:
      type: object
      required:
        - _id
        - product_code
        - name
        - category
        - selling_price
        - is_active
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          example: "665f1a2b3c4d5e6f7a8b9c10"
        product_code:
          type: string
          pattern: '^KPI-[0-9]{3}$'
          readOnly: true
          description: Kode produk unik yang dibuat otomatis dengan format KPI-001.
          example: "KPI-001"
        name:
          type: string
          example: "Kopi Susu Gula Aren"
        category:
          $ref: '#/components/schemas/ProductCategory'
        selling_price:
          type: number
          format: double
          minimum: 0
          example: 22000
        cost_price:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Harga modal per unit. Dapat bernilai null jika belum diketahui.
          example: 12000
        is_active:
          type: boolean
          description: Status produk. Nilai false menandakan produk telah dihapus secara soft delete.
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-03-01T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-01T10:30:00.000Z"

    OrderItem:
      type: object
      required:
        - product_id
        - product_name
        - category
        - qty
        - price_at_sale
      properties:
        product_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          example: "665f1a2b3c4d5e6f7a8b9c10"
        product_name:
          type: string
          description: Nama produk saat transaksi terjadi.
          example: "Kopi Susu Gula Aren"
        category:
          $ref: '#/components/schemas/ProductCategory'
        qty:
          type: integer
          minimum: 1
          example: 2
        price_at_sale:
          type: number
          format: double
          minimum: 0
          description: Harga jual per unit saat transaksi terjadi.
          example: 22000
        cost_at_sale:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Harga modal per unit saat transaksi terjadi. Null jika tidak tersedia.
          example: 12000

    Order:
      type: object
      required:
        - _id
        - transaction_id
        - source
        - items
        - total
        - payment_method
        - transaction_time
        - createdAt
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          example: "66f0a1b2c3d4e5f6a7b8c9d0"
        transaction_id:
          type: string
          description: ID transaksi unik.
          example: "TRX-20261027-0001"
        source:
          type: string
          enum:
            - "pos"
            - "generator"
          description: Sumber transaksi, berasal dari POS atau generator data.
          example: "pos"
        cashier_id:
          type: string
          nullable: true
          pattern: '^[a-fA-F0-9]{24}$'
          description: ID kasir yang membuat transaksi. Null untuk transaksi dari generator.
          example: "665f1a2b3c4d5e6f7a8b9c1e"
        items:
          type: array
          minItems: 1
          items:
